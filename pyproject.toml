[project]
name = "network-slicing-poc"
version = "0.1.0"
description = "Trust-gated multi-agent LLM control for O-RAN network slicing (research PoC)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph (>=1.2.15,<2.0.0)",
    "langchain (>=1.4.6,<2.0.0)",
    "litellm[proxy] (>=1.105.1,<2.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "langchain-litellm (>=0.11.1,<0.12.0)",
    "langsmith (>=0.14.9,<0.15.0)",
    "fakeredis (>=2.40.0,<3.0.0)",
    "pymongo (>=4.19.0,<5.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "langchain-core (>=1.6.11,<2.0.0)",
    "fastapi (>=0.143.3,<1.0.0)",
    "uvicorn (>=0.54.0,<1.0.0)",
    "httpx (>=0.28.1,<1.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.17.0,<0.18.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "mongomock (>=4.3.0,<5.0.0)"
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"


[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# pyflakes, pycodestyle errors, bugbear, import order, pyupgrade, ruff.
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# Scripts put the project root on sys.path before importing it.
"scripts/*" = ["E402"]
