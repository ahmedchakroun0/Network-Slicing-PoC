[project]
name = "network-slicing-poc"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph (>=1.2.15,<2.0.0)",
    "langchain (>=1.4.6,<2.0.0)",
    "litellm[proxy] (>=1.105.1,<2.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "langchain-litellm (>=0.11.1,<0.12.0)",
    "langsmith (>=0.14.8,<0.15.0)",
    "fakeredis (>=2.40.0,<3.0.0)",
    "prisma (>=0.15.0,<0.16.0)",
    "pymongo (>=4.19.0,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.17.0,<0.18.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "mongomock (>=4.3.0,<5.0.0)"
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"